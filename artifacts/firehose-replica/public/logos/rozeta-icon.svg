<svg viewBox="0 0 440 440" xmlns="http://www.w3.org/2000/svg" width="440" height="440">
  <!-- Neo-brutalist drop shadow -->
  <rect x="20" y="20" width="400" height="400" fill="black"/>
  <!-- Black border (acts as the border frame) -->
  <rect x="0" y="0" width="400" height="400" fill="black"/>
  <!-- Yellow interior -->
  <rect x="16" y="16" width="368" height="368" fill="hsl(47,100%,50%)"/>
  <!-- Waveform bars centered in yellow area (center=200,200) -->
  <line x1="96"  y1="172" x2="96"  y2="228" stroke="black" stroke-width="28" stroke-linecap="round"/>
  <line x1="152" y1="124" x2="152" y2="276" stroke="black" stroke-width="28" stroke-linecap="round"/>
  <line x1="208" y1="60"  x2="208" y2="340" stroke="black" stroke-width="28" stroke-linecap="round"/>
  <line x1="264" y1="124" x2="264" y2="276" stroke="black" stroke-width="28" stroke-linecap="round"/>
  <line x1="320" y1="172" x2="320" y2="228" stroke="black" stroke-width="28" stroke-linecap="round"/>
</svg>